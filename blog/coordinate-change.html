<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinate Change Visualization</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
}

.container {
    max-width: 1400px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

svg {
    width: 100%;
    height: 400px;
    border: 1px solid #ddd;
    background: white;
}

h1 {
    margin-top: 0;
}

.info {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 15px;
    margin-top: 20px;
}

.info div {
    background: white;
    padding: 12px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
</style>
</head>

<body>

<div class="container">

    <h1>Coordinate Change Visualization</h1>

    <p>
        Mapping
        (a,b,s) → (θ, α, n)
    </p>

    <p>
        θ = arccos(1 / √(1+s²))<br>
        α = a√(1+s²)<br>
        n = (ab + s²ab − s)/(a² + s²a²)
    </p>

    <div class="card">
        <label>
            <strong>T = <span id="Tvalue">1000</span></strong>
        </label>
        <br><br>
        <input
            id="Tslider"
            type="range"
            min="100"
            max="100000"
            step="100"
            value="1000"
            style="width:100%;"
        >
    </div>

    <br>

    <div class="grid">

        <div class="card">
            <h3>Original Region Projection (a,b)</h3>
            <svg id="abPlot" viewBox="0 0 420 320"></svg>
        </div>

        <div class="card">
            <h3>Transformed Projection (α,n)</h3>
            <svg id="anPlot" viewBox="0 0 420 320"></svg>
        </div>

    </div>

    <div class="info">
        <div>
            Sampled points:
            <span id="count"></span>
        </div>

        <div>
            θ approaches π/2 as s increases.
        </div>

        <div>
            Move the slider to vary T.
        </div>
    </div>

</div>

<script>

const slider = document.getElementById("Tslider");
const Tvalue = document.getElementById("Tvalue");

slider.addEventListener("input", update);

function randomBetween(a,b){
    return a + Math.random()*(b-a);
}

function generatePoints(T){

    const points = [];
    const N = 5000;

    for(let i=0;i<N;i++){

        const b = 0.001 + 0.999*Math.random();

        const boundary1 = 1 - b;
        const boundary2 = 1/(b*T);

        const amin = Math.max(
            Math.min(boundary1,boundary2),
            1e-6
        );

        const amax = Math.max(
            boundary1,
            boundary2
        );

        if(amax <= amin) continue;

        const a = randomBetween(amin,amax);

        const sMax = 1/(a*b);

        if(sMax <= T) continue;

        const s = randomBetween(T,sMax);

        const theta =
            Math.acos(1/Math.sqrt(1+s*s));

        const alpha =
            a*Math.sqrt(1+s*s);

        const n =
            (a*b + s*s*a*b - s) /
            (a*a + s*s*a*a);

        if(
            Number.isFinite(theta) &&
            Number.isFinite(alpha) &&
            Number.isFinite(n)
        ){
            points.push({
                a,b,s,
                theta,
                alpha,
                n
            });
        }
    }

    return points;
}

function drawScatter(svgId,data,xkey,ykey,color){

    const svg = document.getElementById(svgId);

    while(svg.firstChild)
        svg.removeChild(svg.firstChild);

    if(data.length===0) return;

    const xs = data.map(p=>p[xkey]);
    const ys = data.map(p=>p[ykey]);

    const xmin = Math.min(...xs);
    const xmax = Math.max(...xs);

    const ymin = Math.min(...ys);
    const ymax = Math.max(...ys);

    data.forEach(p=>{

        const x =
            20 +
            380*(p[xkey]-xmin)/
            ((xmax-xmin)||1);

        const y =
            300 -
            280*(p[ykey]-ymin)/
            ((ymax-ymin)||1);

        const c =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

        c.setAttribute("cx",x);
        c.setAttribute("cy",y);
        c.setAttribute("r",2);
        c.setAttribute("fill",color);
        c.setAttribute("opacity",0.6);

        svg.appendChild(c);
    });

    const frame =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "rect"
        );

    frame.setAttribute("x",20);
    frame.setAttribute("y",20);
    frame.setAttribute("width",380);
    frame.setAttribute("height",280);
    frame.setAttribute("fill","none");
    frame.setAttribute("stroke","#777");

    svg.appendChild(frame);
}

function update(){

    const T = Number(slider.value);

    Tvalue.textContent =
        T.toLocaleString();

    const points =
        generatePoints(T);

    document.getElementById("count")
        .textContent = points.length;

    drawScatter(
        "abPlot",
        points,
        "a",
        "b",
        "#2563eb"
    );

    drawScatter(
        "anPlot",
        points,
        "alpha",
        "n",
        "#dc2626"
    );
}

update();

</script>

</body>
</html>
